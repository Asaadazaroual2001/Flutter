name: flutter_recipes_app
description: A Flutter recipe management app using Firebase
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.0

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0

  # Features
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.2
  flutter_rating_bar: ^4.0.1

  # PDF
  pdf: ^3.11.0
  printing: ^5.12.0
  path_provider: ^2.1.2

  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_lints: ^3.0.2
